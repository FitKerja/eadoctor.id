    <main class="auth">
      <div class="wadah">
        <div class="auth__kartu" style="margin: 0 auto">
          <h1>Buat akun</h1>
          <p>Daftar untuk mengakses EADOCTOR.</p>
          <!-- Terhubung ke api/daftar.php (simpan ke MySQL + kirim email selamat) -->
          <form class="formulir" action="api/daftar.php" method="post" data-formulir-daftar novalidate>
            <div class="isian">
              <label for="nama">Nama lengkap</label>
              <input id="nama" name="nama" type="text" autocomplete="name" required minlength="3" maxlength="100" />
            </div>
            <div class="isian">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required maxlength="190" />
            </div>
            <div class="isian">
              <label for="wa">Nomor WhatsApp</label>
              <input id="wa" name="wa" type="tel" autocomplete="tel" inputmode="tel" required placeholder="08xxxxxxxxxx" />
            </div>
            <div class="isian">
              <label for="sandi">Kata sandi</label>
              <input id="sandi" name="sandi" type="password" autocomplete="new-password" required minlength="8" placeholder="Minimal 8 karakter" />
            </div>
            <!-- honeypot anti-bot: disembunyikan dari pengguna -->
            <div class="isian" style="position: absolute; left: -9999px" aria-hidden="true">
              <label for="situs">Situs</label>
              <input id="situs" name="situs" type="text" tabindex="-1" autocomplete="off" />
            </div>
            <button class="tombol tombol--emas tombol--lebar" type="submit">Daftar</button>
            <p class="formulir__info" data-formulir-info role="status" hidden></p>
          </form>
        </div>
      </div>
    </main>
